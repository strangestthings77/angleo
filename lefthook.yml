pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,jsx,tsx,json,css,md,mdx}'
      run: pnpm prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: pnpm eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
